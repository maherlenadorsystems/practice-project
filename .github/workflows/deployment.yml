name: Deployment Workflow
on: push
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Download Dependencies
        run: npm ci

      - name: Run Lint Command
        run: npm run lint

  Test:
    needs: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Intall Dependencies
        run: npm ci

      - name: Run Test Command
        run: npm test

  Build:
    needs: [Lint, Test]
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Download Dependencies
        run: npm ci

      - name: Run Test Command
        run: npm test
