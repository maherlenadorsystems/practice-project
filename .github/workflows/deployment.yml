name: Deployment Workflow
on: push
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Download Dependencies
        run: npm ci

      - name: Run Lint Command
        run: npm run lint

  Test:
    needs: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Intall Dependencies
        run: npm ci

      - name: Run Test Command
        run: npm test

  Build:
    needs: Test
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3

      - name: Download Dependencies
        run: npm ci

      - name: Run Build Command
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: |
            dist
            package.json

  Deploy:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Get Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files

      - name: Output contens
        run: ls

      - name: Deploy
        run: echo "Deploying ..."
